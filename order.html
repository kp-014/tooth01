<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&family=Noto+Serif+Thai:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container container--narrow">
      <div class="section-head">
        <h1 class="page-title">สั่งซื้อสินค้า</h1>
        <span class="rule"></span>
        <p class="lead">กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อ เราจะติดต่อกลับโดยเร็ว</p>
      </div>

      <form id="orderForm" class="order-form">
        <div class="field">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" autocomplete="tel" required>
        </div>

        <div class="field">
          <label for="items">รายการสินค้า</label>
          <textarea id="items" name="items" rows="2" required></textarea>
        </div>

        <div class="field">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" name="total" inputmode="decimal" required>
        </div>

        <div class="field">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn--accent">ยืนยันสั่งซื้อ</button>

        <p class="form-hint">ต้องการเลือกสินค้าเพิ่ม <a href="product.html">กลับไปดูสินค้า</a></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="text-center" style="margin-inline:auto;">© 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
